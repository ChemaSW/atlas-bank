#ACCEDER A LA BD: http://localhost:8080/h2-console
spring:
  application:
    name: atlas-bank
  datasource: #Datos de conexion
    url: jdbc:h2:mem:atlasbank
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa: #Indicamos a que base se va a conectar
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2: #habilitamos la consola de H2
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resourceserver:
        jwt:
          #Indicamos por medio de la url donde esta Keycloack y que realm vamos a utilizar
          issuer-uri: http://localhost:8181/realms/atlas-bank
server:
  port: 8080