spring:
  application:
    name: atlas-bank
  datasource: #Datos de conexion
    url: jdbc:h2:mem:atlasbank
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa: #Indicamos a que base se va a conectar
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2: #habilitamos la consola de H2
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080